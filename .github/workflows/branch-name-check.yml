name: Check Branch Name

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          # Example pattern: allow layer/, feature-type/, name/, feature/, sub-feature/
          REGEX="(documentation|backend|frontend|firmware)/(bug-fix|feature|hotfix|optimization|task)/[a-z]+/[a-z-]+/[a-z-]+"
          
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow the required naming convention."
            echo "Format must match: <layer>/<feature-type>/<name>/<feature>/<sub-feature> (only lowercase letters and numbers)"
            exit 1
          else
            echo "Branch name '$BRANCH_NAME' is valid."
          fi
