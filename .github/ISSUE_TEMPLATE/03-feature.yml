name: Feature
description: A new or additional feature for the project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: What functionality will this feature provide?
      description: Provide a clear and concise description of what the feature will do.
    validations:
      required: true

  - type: textarea
    id: feature-requirements
    attributes:
      label: What must be added to the project to implement this feature?
      description: A clear and concise description of what is required to implement the feature.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      options:
        - Low
        - Medium
        - High
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have attached this issue to the appropriate section of the project board.
          required: true
